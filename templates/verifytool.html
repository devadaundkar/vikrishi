<body>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <label>Upload Tool Image:</label>
        <input type="file" name="image" required>
        <button type="submit">Check</button>
    </form>
    
    {% if result %}
        <h3>{{ result }}</h3>
        <img src="{{ image_url }}" width="300">
    {% endif %}   
</body>
